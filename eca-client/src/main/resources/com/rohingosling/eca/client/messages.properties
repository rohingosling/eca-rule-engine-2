user.guide.title=User Guide
user.guide.overview.heading=Overview
user.guide.what.to.do.heading=What to do here
user.guide.technical.note.link=Open the technical note
user.guide.github.link=Open the project on GitHub
user.guide.model.overview=For a fixed finite rule base and tie selector, the stateless engine maps the current event occurrence to exactly one action or the no-action value. The document overview identifies the authoring model that supplies that rule base. Repeated evaluation of the same occurrence and revision therefore produces the same result.
user.guide.model.equation.accessible=Q sub tau comma R maps the event-occurrence set X to the action set extended with bottom.
user.guide.model.steps=1. Give the document a stable model ID.\n2. Add a clear name and concise domain description.\n3. Work through the Outline categories in dependency order, beginning with Parameters.\n4. Validate the model and resolve every diagnostic.\n5. Save the document, then push the valid revision when it is ready for simulation.
user.guide.parameters.overview=Each parameter key has a typed domain of legitimate concrete values. A payload binding may hold a concrete value or the distinguished present-null marker; omission represents key absence. Parameters are reusable definitions shared by payload schemas and conditions.
user.guide.parameters.equation.accessible=V bar sub k equals V sub k disjoint union nu; a binding pairs key k with a value in V bar sub k.
user.guide.parameters.steps=1. Add a new parameter or select an existing one.\n2. Assign a stable ID, descriptive name, and useful explanation.\n3. Choose the value type that the payload and conditions must obey.\n4. For an enumeration, enter every permitted value once and review its spelling.\n5. Apply the definition and resolve diagnostics before referencing the parameter elsewhere.
user.guide.payloads.overview=A payload schema limits the keys permitted for an event. An occurrence payload is a finite typed partial map, so each permitted key can be concrete, explicitly null, or absent. Extra keys outside the selected event schema are invalid.
user.guide.payloads.equation.accessible=The domain of payload p is a subset of K sub e, and each present p of k belongs to V bar sub k.
user.guide.payloads.steps=1. Add a payload schema or select one from the grid.\n2. Give it a stable identity and describe the event data it represents.\n3. Select only the parameters that occurrences of this shape may carry.\n4. Check that each required domain value is represented by the selected parameter definitions.\n5. Apply the schema, then reference it from the appropriate event definitions.
user.guide.events.overview=An event type identifies what occurred; an event occurrence pairs that type with its current payload. The empty payload is a valid finite partial map. Rules first compare this event identity before testing their condition sets.
user.guide.events.equation.accessible=An occurrence x equals event e paired with payload p; X contains all such pairs where p belongs to P sub e.
user.guide.events.steps=1. Add an event or select an existing definition.\n2. Assign a stable ID, readable name, and concise occurrence description.\n3. Choose the payload schema that constrains this event's data.\n4. Apply the definition and resolve any missing-schema diagnostic.\n5. Create rules that reference the event, then exercise it in the Simulator.
user.guide.conditions.overview=An atomic condition constrains one parameter. The technical note core uses concrete equality or an explicit-null wildcard; the client also exposes typed comparison and range operators as authoring extensions.
user.guide.conditions.equation.accessible=A condition pair contains key k and q from V hat sub k, where V hat sub k is V sub k extended with the wildcard.
user.guide.conditions.steps=1. Add a reusable condition or select one from the grid.\n2. Choose the parameter whose payload value will be tested.\n3. Select an operator that is valid for that parameter's type.\n4. Enter the required value or range endpoints; ANY requires no operand.\n5. Apply the definition and correct every type, ordering, or value diagnostic.
user.guide.condition-sets.overview=A condition set is a finite typed partial map interpreted conjunctively: every present condition must match. Specificity gives two points to each concrete condition, one to each explicit wildcard, and zero to omission. Only fully matching condition sets compete by specificity.
user.guide.condition-sets.equation.accessible=Mu of c comma p is true when every condition matches; sigma of c equals twice the concrete count plus the wildcard count.
user.guide.condition-sets.steps=1. Add a condition set or select an existing one.\n2. Give the conjunction a stable identity and meaningful description.\n3. Select every reusable condition that must be true together.\n4. Review unresolved conditions and the computed specificity score.\n5. Apply the selection, then reference the condition set from the intended rules.
user.guide.actions.overview=Actions are opaque values returned by rule selection. Selecting an action does not execute it; execution and side effects remain outside the stateless mathematical model. The bottom symbol is a separate result meaning that no rule selected an action.
user.guide.actions.equation.accessible=A sub bottom equals the action set A disjoint union the no-action value bottom.
user.guide.actions.steps=1. Add a symbolic action or select an existing one.\n2. Assign a stable ID that rules can reference safely.\n3. Add a readable name that identifies the intended outcome.\n4. Describe what an external application may do with the returned symbol.\n5. Apply the action, then reference it from one or more rules.
user.guide.rules.overview=A rule combines a stable identifier, event type, condition set, and action. During evaluation, only fully matching rules compete; specificity ranks them and the fixed selector resolves any remaining tie. The rule ID has no matching meaning but makes tie resolution deterministic.
user.guide.rules.equation.accessible=Rule r equals the tuple i comma e comma c comma a in I times E times C times A.
user.guide.rules.steps=1. Add a rule or select one from the grid.\n2. Choose the event type that makes the rule applicable.\n3. Choose the conjunctive condition set that must match.\n4. Choose the symbolic action returned when the rule wins.\n5. Apply and validate the rule, then review equal-specificity competitors before simulation.
user.guide.simulator.overview=The simulator sends one current event occurrence to the server's stateless query. The query returns bottom when no rule matches, otherwise it returns the action of the deterministic winning rule. Revision comparison confirms whether the server evaluated the current local model.
user.guide.simulator.equation.accessible=Q sub tau of x comma R returns bottom when L sub R of x is empty, and otherwise returns the action of w sub tau comma R of x.
user.guide.simulator.steps=1. Validate and push the current model to the server.\n2. Select the event type for the occurrence you want to test.\n3. Set each permitted payload field to Concrete, null, or Omitted and enter typed values where required.\n4. Evaluate the occurrence and inspect the action, winning rule, specificity, and latency.\n5. Confirm that the server revision matches the local document before relying on the result.
